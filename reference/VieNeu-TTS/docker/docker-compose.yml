x-base-config: &base-config
  volumes:
    - ./:/workspace
    - huggingface_cache:/home/app/.cache/huggingface
    - ./output_audio:/workspace/output_audio
  env_file:
    - path: .env
      required: false
  environment:
    - HF_HOME=${HF_HOME:-/home/app/.cache/huggingface}
    - PYTHONUNBUFFERED=1
    - PORT=${PORT:-7860}
    - GRADIO_SERVER_PORT=${GRADIO_SERVER_PORT:-7860}
    - GRADIO_SERVER_NAME=${GRADIO_SERVER_NAME:-0.0.0.0}
    - GRADIO_SHARE=${GRADIO_SHARE:-0}
  ports:
    - "${PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
  stdin_open: true
  tty: true

services:
  # ========================================================
  # CPU profile — Web UI, v3 Turbo (ONNX) + v3 Nano, torch-free
  #   docker compose -f docker/docker-compose.yml --profile cpu up
  # ========================================================
  cpu:
    <<: *base-config
    profiles: ["cpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: vieneu-tts-cpu
    command: ["python", "apps/gradio_main.py"]

  # ========================================================
  # GPU profile — Web UI, v3 Turbo on CUDA (PyTorch) + v3 Nano
  #   docker compose -f docker/docker-compose.yml --profile gpu up
  # ========================================================
  gpu:
    <<: *base-config
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: dev
    container_name: vieneu-tts-gpu-dev
    command: ["python", "apps/gradio_main.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========================================================
  # Serve profile — LEGACY v1/v2 LMDeploy API server (not used by v3)
  # ========================================================
  serve:
    profiles: ["serve"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    container_name: vieneu-tts-serve
    ports:
      - "${SERVE_PORT:-23333}:23333"
    environment:
      - HF_HOME=${HF_HOME:-/root/.cache/huggingface}
      - PYTHONUNBUFFERED=1
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${MODEL:-pnnbao-ump/VieNeu-TTS-v2}"
      - "--model-name"
      - "${MODEL_NAME:-pnnbao-ump/VieNeu-TTS-v2}"
      - "--port"
      - "23333"
      - "--memory-util"
      - "${MEMORY_UTIL:-0.3}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_cache:
